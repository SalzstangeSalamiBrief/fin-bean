services:
  postgres:
    image: postgres:17.2-alpine
    container_name: finbean-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finbean}
      POSTGRES_USER: ${POSTGRES_USER:-finbean}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-local-dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - finbean_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finbean} -d ${POSTGRES_DB:-finbean}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: finbean-keycloak
    restart: unless-stopped
    # start-dev is a dev-only mode (HTTP allowed, in-memory storage). Never use in production.
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-changeme-local-dev}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

volumes:
  finbean_postgres_data:
    name: finbean_postgres_data
